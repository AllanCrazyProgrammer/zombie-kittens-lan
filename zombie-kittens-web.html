:root {
  --night: #170c33; --night2: #2a1760; --panel: #2b1c5c; --panel2: #382673; --line: #4d3a94;
  --ink: #f4efff; --dim: #b3a6dc; --toxic: #b6f23a; --toxic2: #7fc21e; --pink: #ff5c8d; --gold: #ffd23a; --red: #ff4055; --cyan: #49e0e6;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
body { background: radial-gradient(120% 80% at 50% 0%, var(--night2), var(--night) 70%); color: var(--ink); font-family: Nunito, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 15px; line-height: 1.35; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
#app { height: 100%; max-width: 560px; margin: 0 auto; position: relative; }
h1, h2, h3, h4, .btn, .turn, .c-name, .pill, .badge { font-family: Bangers, Impact, 'Arial Narrow', sans-serif; font-weight: 400; letter-spacing: .04em; }
h1 { font-size: 40px; margin: 0; line-height: 1; } h2 { font-size: 26px; margin: 0; } h3 { font-size: 21px; margin: 14px 0 6px; color: var(--toxic); } h4 { font-size: 19px; margin: 16px 0 4px; color: var(--toxic); }
p { margin: 6px 0; } ul, ol { margin: 6px 0; padding-left: 20px; } li { margin: 3px 0; }
.dim { color: var(--dim); } .small { font-size: 12.5px; } .grow { flex: 1 1 0; min-height: 0; } .center { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
input { font: inherit; color: var(--ink); background: #150a30; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; outline: none; user-select: text; -webkit-user-select: text; }
input:focus { border-color: var(--toxic); }
code { display: block; background: #150a30; border-radius: 8px; padding: 6px 8px; font-size: 15px; color: var(--toxic); word-break: break-all; user-select: text; -webkit-user-select: text; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 8px 16px; border-radius: 14px; font-size: 20px; background: var(--panel2); color: var(--ink); border: 2px solid var(--line); box-shadow: 0 4px 0 #120828; transition: transform .06s, box-shadow .06s, filter .15s; flex: 1 1 auto; text-align: center; line-height: 1.05; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #120828; }
.btn.primary { background: linear-gradient(#c6ff4a, #8fd320); color: #16250a; border-color: #dcff8a; box-shadow: 0 4px 0 #4e7a10; }
.btn.green { background: linear-gradient(#49e0a0, #1fae74); color: #062a1a; border-color: #9af5cf; box-shadow: 0 4px 0 #0d6b46; }
.btn.danger { background: linear-gradient(#ff6a7c, #e0283f); color: #fff; border-color: #ffa5b0; box-shadow: 0 4px 0 #8a1020; }
.btn.ghost { background: transparent; border-color: #ffffff40; box-shadow: none; color: #fff; }
.btn.xl { min-height: 56px; font-size: 25px; width: 100%; } .btn.sm { min-height: 34px; font-size: 16px; padding: 4px 8px; border-radius: 10px; box-shadow: 0 2px 0 #120828; }
.btn:disabled { filter: grayscale(1) brightness(.7); pointer-events: none; }
.row { display: flex; gap: 10px; align-items: stretch; } .row.tight { gap: 6px; }
.ic { width: 42px; height: 42px; border-radius: 12px; background: var(--panel2); border: 2px solid var(--line); font-size: 20px; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.ic.sm { width: 32px; height: 32px; font-size: 14px; border-radius: 9px; }
.pill { font-size: 14px; padding: 2px 9px; border-radius: 99px; background: var(--panel2); border: 1.5px solid var(--line); } .pill.gold { background: var(--gold); color: #3a2a00; border-color: #fff0a8; } .pill.green { background: var(--toxic); color: #16250a; border-color: #e4ffa8; }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: inline-block; flex: 0 0 auto; overflow: hidden; border: 2.5px solid #fff; background: #0003; position: relative; } .avatar svg { width: 100%; height: 100%; display: block; }
.avatar.big { width: 64px; height: 64px; overflow: visible; } .avatar.big svg { border-radius: 50%; } .avatar.big i { position: absolute; right: -6px; bottom: -4px; background: var(--toxic); color: #16250a; width: 24px; height: 24px; border-radius: 50%; font-style: normal; display: grid; place-items: center; font-size: 15px; border: 2px solid var(--night); }
.avatar.huge { width: 120px; height: 120px; border-width: 5px; } .avatar.ghost { border: 2.5px dashed var(--line); }
.spinner { width: 46px; height: 46px; border-radius: 50%; border: 5px solid var(--line); border-top-color: var(--toxic); animation: spin .8s linear infinite; } .spinner.sm { width: 20px; height: 20px; border-width: 3px; display: inline-block; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- pantallas ---------- */
.screen { height: 100%; display: flex; flex-direction: column; gap: 12px; padding: calc(12px + var(--sat)) 16px calc(14px + var(--sab)); overflow-y: auto; }
.screen.center { justify-content: center; }
.bar { display: flex; align-items: center; gap: 10px; } .bar h2 { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.home { justify-content: flex-start; } .home-art { text-align: center; margin-top: 2vh; } .logo { width: min(100%, 46vh); height: auto; filter: drop-shadow(0 8px 0 #0006); }
.tag { font-family: Bangers, Impact, sans-serif; font-size: 19px; color: var(--pink); margin: -2px 0 0; letter-spacing: .05em; }
.profile { display: flex; align-items: center; gap: 16px; background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 12px 14px; } .profile label { flex: 1; } .profile label span { display: block; font-size: 12px; color: var(--dim); margin-bottom: 3px; }
.menu { display: flex; flex-direction: column; gap: 11px; } .menu .btn { width: 100%; }
.fine { font-size: 10.5px; color: #8f82bb; text-align: center; margin-top: auto; }
.panel { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 12px; }
.connect { display: flex; gap: 12px; align-items: center; font-size: 13.5px; } .connect p { margin: 3px 0; } .qr { width: 112px; height: 112px; border-radius: 10px; background: #fff; flex: 0 0 auto; }
.players { display: flex; flex-direction: column; gap: 7px; } .prow { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 7px 10px; min-height: 58px; } .prow b { flex: 1; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .prow.empty { border-style: dashed; opacity: .55; }
.waiting, .searching { text-align: center; padding: 14px; color: var(--dim); }
.found { display: flex; flex-direction: column; gap: 8px; } .found-item { display: flex; flex-direction: column; text-align: left; background: var(--panel); border: 2px solid var(--toxic2); border-radius: 14px; padding: 12px 14px; } .found-item b { font-size: 18px; } .found-item span { color: var(--dim); font-size: 13px; }
.iprow { display: flex; gap: 8px; } .iprow .btn { flex: 0 0 auto; }
.tips { background: #150a3080; border-radius: 14px; padding: 12px; font-size: 13px; color: var(--dim); } .tips b { color: var(--ink); }

/* ---------- cartas ---------- */
.card { --w: 104px; width: var(--w); height: calc(var(--w) * 1.4); font-size: calc(var(--w) * .1); border-radius: .9em; background: #fbf5e6; border: .22em solid #150a22; color: #1c1326; display: flex; flex-direction: column; overflow: hidden; position: relative; flex: 0 0 auto; box-shadow: 0 .3em .6em #0007; text-align: left; }
.c-top { background: var(--cc); color: #fff; display: flex; align-items: center; gap: .3em; padding: .3em .45em .25em; min-height: 2.5em; }
.c-ico { font-size: 1.35em; line-height: 1; filter: drop-shadow(0 1px 0 #0005); } .c-name { font-size: 1.32em; line-height: .95; text-shadow: 0 .08em 0 #0006; }
.c-art { flex: 1 1 0; min-height: 0; position: relative; border-top: .18em solid #150a22; border-bottom: .18em solid #150a22; } .c-art svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.c-now { position: absolute; right: .3em; top: .3em; background: var(--gold); color: #2a1c00; font-family: Bangers, Impact, sans-serif; font-size: 1.05em; padding: .05em .45em; border-radius: .5em; border: .12em solid #150a22; transform: rotate(6deg); }
.c-txt { font-size: .78em; line-height: 1.15; padding: .4em .55em .3em; height: 5.6em; overflow: hidden; font-weight: 700; }
.c-paw { position: absolute; left: .35em; bottom: 4.75em; font-size: .9em; background: #fbf5e6; border: .12em solid #150a22; border-radius: 50%; width: 1.7em; height: 1.7em; display: grid; place-items: center; }
.card.back { padding: 0; background: none; } .card.back svg { width: 100%; height: 100%; display: block; }
.card.xl { --w: min(200px, 52vw); } .card.mini { --w: 86px; } .card.gd { --w: 112px; } .card.f { --w: min(104px, 27vw); } .card.g { --w: min(92px, 27vw); }

/* ---------- mesa de juego ---------- */
.game { height: 100%; display: flex; flex-direction: column; padding-top: var(--sat); padding-bottom: var(--sab); position: relative; }

<script>window.ZK_STATIC = true;</script>

<script>/* Motor de reglas de Zombie Kittens (autoritativo, corre en el dispositivo anfitrión).
 * Sin dependencias: funciona igual en el navegador/WebView y en Node (pruebas). */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.ZKEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // [tipo, copias CON huella, copias SIN huella]  (reglamento oficial: 24 con, 33 sin, + 4 explosivos = 61)
  const DECK = [
    ['zombie', 2, 3], ['attack', 2, 0], ['attack_dead', 0, 3], ['nope', 2, 3],
    ['skip', 1, 2], ['super_skip', 1, 1], ['see_future', 2, 2], ['shuffle', 1, 1],
    ['feed_dead', 0, 2], ['clone', 1, 2], ['grave_robber', 0, 1], ['favor', 1, 2],
    ['dig_deeper', 2, 2], ['clairvoyance', 1, 1],
    ['cat_a', 2, 2], ['cat_b', 2, 2], ['cat_c', 2, 2], ['cat_d', 2, 2],
  ];
  const NAMES = {
    exploding: 'Gatito Explosivo', zombie: 'Gatito Zombi', attack: 'Ataque (2x)',
    attack_dead: 'Ataque de los Muertos', nope: 'Nop', skip: 'Saltar', super_skip: 'Súper Salto',
    see_future: 'Ver el Futuro (3x)', shuffle: 'Barajar', feed_dead: 'Alimenta a los Muertos',
    clone: 'Clon', grave_robber: 'Ladrón de Tumbas', favor: 'Favor', dig_deeper: 'Cava Más Hondo',
    clairvoyance: 'Clarividencia', cat_a: 'Gato Momia', cat_b: 'Vampigato', cat_c: 'Fantasmiau',
    cat_d: 'Esquelegato',
  };
  const NOW = { shuffle: 1, feed_dead: 1, clairvoyance: 1 };
  const CFG = { NOPE_MS: 6500, FAST_MS: 900, PROMPT_MS: 40000, GONE_MS: 6000, CLAIR_MS: 4000, HAND: 7 };
  const isCat = (t) => t.indexOf('cat_') === 0;

  function shuffleArr(a, rnd) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  class Game {
    constructor(opts) {
      this.rnd = opts.rnd || Math.random;
      this.cfg = Object.assign({}, CFG, opts.cfg || {});
      this.players = opts.players.map((p) => ({
        id: p.id, name: p.name, avatar: p.avatar || 0, bot: !!p.bot,
        hand: [], alive: true, ek: null, connected: true,
      }));
      this.draw = []; this.discard = []; this.stack = [];
      this.prompt = null; this.over = null;
      this.events = []; this.seq = 0; this.pid = 0; this.mut = 0; this.shuf = 0;
      this.cur = 0; this.turnsLeft = 1; this.attacked = false; this.idleSince = opts.now || 0;
      this.setup(opts.deckMode || 'official');
    }

    setup(mode) {
      const n = this.players.length;
      let id = 0;
      const cards = [], zombies = [], eks = [];
      for (const [type, w, wo] of DECK) {
        const make = (k, paw) => { for (let i = 0; i < k; i++) (type === 'zombie' ? zombies : cards).push({ id: 'c' + (++id), type, paw }); };
        if (mode === 'full' || n >= 4) { make(w, true); make(wo, false); }
        else if (n === 2) make(w, true);
        else make(wo, false);
      }
      for (let i = 0; i < 4; i++) eks.push({ id: 'c' + (++id), type: 'exploding', paw: false });
      shuffleArr(zombies, this.rnd);
      for (const p of this.players) if (zombies.length) p.hand.push(zombies.pop());
      cards.push(...zombies);
      shuffleArr(cards, this.rnd);
      for (let k = 0; k < this.cfg.HAND; k++) for (const p of this.players) if (cards.length) p.hand.push(cards.pop());
      for (let i = 0; i < n - 1; i++) cards.push(eks.pop());
      this.draw = shuffleArr(cards, this.rnd);
      this.cur = Math.floor(this.rnd() * n);
      this.emit('start', { text: '¡Comienza la partida! Empieza ' + this.curP().name + '.' });
    }

    /* ---------- utilidades ---------- */
    P(id) { return this.players.find((p) => p.id === id); }
    curP() { return this.players[this.cur]; }
    living() { return this.players.filter((p) => p.alive); }
    dead() { return this.players.filter((p) => !p.alive); }
    top() { return this.stack[this.stack.length - 1]; }
    topDiscard() { return this.discard[this.discard.length - 1]; }
    idle() { return !this.prompt && !this.stack.length && !this.over; }
    emit(type, data, to) {
      const e = Object.assign({ seq: ++this.seq, type }, data || {});
      if (to) e.to = to;
      this.events.push(e);
      if (this.events.length > 80) this.events.splice(0, this.events.length - 80);
      return e;
    }
    shuffleDraw() { shuffleArr(this.draw, this.rnd); this.mut++; this.shuf++; }
    nextLivingIdx(from) {
      const n = this.players.length;
      for (let k = 1; k <= n; k++) { const i = (from + k) % n; if (this.players[i].alive) return i; }
      return from;
    }
    dl(ids, now, base) {
      const gone = ids.every((id) => { const p = this.P(id); return p && !p.bot && !p.connected; });
      return now + (gone ? this.cfg.GONE_MS : (base || this.cfg.PROMPT_MS));
    }

    /* ---------- validación de jugadas ---------- */
    plan(pid, ids, target, named) {
      if (this.over) return { err: 'La partida ya terminó.' };
      const p = this.P(pid);
      if (!p) return { err: 'Jugador desconocido.' };
      if (!ids || !ids.length || ids.length > 3) return { err: 'Selección inválida.' };
      const cards = [];
      for (const id of ids) {
        const c = p.hand.find((x) => x.id === id);
        if (!c || cards.indexOf(c) >= 0) return { err: 'No tienes esa carta.' };
        cards.push(c);
      }
      const isCur = this.curP().id === pid;
      const pr = this.prompt;
      const deadN = this.dead().length;

      if (cards.length === 1) {
        let eff = cards[0].type;
        if (eff === 'clone') {
          if (!p.alive || !isCur) return { err: 'El Clon solo se juega en tu turno y estando vivo.' };
          const td = this.topDiscard();
          if (!td) return { err: 'No hay ninguna carta debajo para clonar.' };
          if (td.card.type === 'clone') return { err: 'No puedes jugar un Clon sobre otro Clon.' };
          eff = td.card.type;
          if (isCat(eff) || eff === 'exploding') return { err: 'Clonar esa carta sola no hace nada. Úsalo en pareja con otra carta.' };
        }
        if (eff === 'zombie') {
          if (!(pr && pr.type === 'explode' && pr.player === pid)) return { err: 'El Gatito Zombi se juega cuando sacas un Gatito Explosivo (o en combos).' };
          return { kind: 'zombie', eff, cards };
        }
        if (isCat(eff)) return { err: 'Las cartas de gato se juegan en pareja o en trío.' };
        if (eff === 'nope') {
          const t = this.top();
          if (!t || (pr && pr.type !== 'zombie')) return { err: 'No hay ninguna jugada que anular ahora.' };
          if (t.last === pid) return { err: 'No puedes anular tu propia jugada.' };
          return { kind: 'nope', eff, cards };
        }
        if (eff === 'clairvoyance') {
          if (!(pr && pr.type === 'zombie' && pr.player !== pid)) return { err: 'Clarividencia se juega cuando OTRO jugador usa un Gatito Zombi.' };
          if (pr.watchers.indexOf(pid) >= 0 || this.stack.some((s) => s.eff === 'clairvoyance' && s.by === pid)) return { err: 'Ya estás mirando.' };
          return { kind: 'action', eff, cards };
        }
        if (pr) return { err: 'Espera a que termine la acción en curso.' };
        if (NOW[eff]) {
          if (eff === 'feed_dead') {
            if (!deadN) return { err: 'No hay jugadores muertos.' };
            if (!target) return { need: 'dead', eff, cards };
            const t = this.P(target);
            if (!t || t.alive) return { err: 'Elige a un jugador muerto.' };
          }
          return { kind: 'action', eff, cards, target: eff === 'feed_dead' ? target : null };
        }
        if (!isCur || !p.alive) return { err: 'Solo puedes jugar esa carta en tu turno.' };
        if (this.stack.length) return { err: 'Espera a que se resuelva la jugada anterior.' };
        if ((eff === 'attack_dead' || eff === 'grave_robber') && !deadN) return { err: 'No hay jugadores muertos: no puedes jugar esta carta.' };
        if (eff === 'favor') {
          if (!this.players.some((o) => o.id !== pid && o.alive && o.hand.length)) return { err: 'Nadie tiene cartas para darte.' };
          if (!target) return { need: 'living', eff, cards };
          const t = this.P(target);
          if (!t || !t.alive || t.id === pid || !t.hand.length) return { err: 'Elige a un jugador vivo con cartas.' };
          return { kind: 'action', eff, cards, target };
        }
        return { kind: 'action', eff, cards, target: null };
      }

      // Combos especiales: dos o tres iguales (el Clon copia a la carta que acompaña)
      const real = cards.filter((c) => c.type !== 'clone');
      if (!real.length) return { err: 'Un combo necesita al menos una carta que no sea Clon.' };
      if (real.some((c) => c.type !== real[0].type)) return { err: 'Las cartas del combo deben tener el mismo título.' };
      if (!isCur || !p.alive) return { err: 'Los combos solo se juegan en tu turno.' };
      if (pr) return { err: 'Espera a que termine la acción en curso.' };
      if (this.stack.length) return { err: 'Espera a que se resuelva la jugada anterior.' };
      if (!this.players.some((o) => o.id !== pid && o.alive && o.hand.length)) return { err: 'Ningún jugador vivo tiene cartas para robar.' };
      const eff = cards.length === 2 ? 'combo2' : 'combo3';
      if (!target) return { need: 'living', eff, cards, of: real[0].type };
      const t = this.P(target);
      if (!t || !t.alive || t.id === pid || !t.hand.length) return { err: 'Elige a un jugador vivo con cartas.' };
      if (eff === 'combo3') {
        if (!named) return { need: 'named', eff, cards, target, of: real[0].type };
        if (!NAMES[named] || named === 'exploding') return { err: 'Carta inválida.' };
      }
      return { kind: 'action', eff, cards, target, named: eff === 'combo3' ? named : null, of: real[0].type };
    }

    /* ---------- entrada de acciones ---------- */
    act(pid, a, now) {
      if (this.over) return 'La partida ya terminó.';
      const p = this.P(pid);
      if (!p || !a) return 'Acción inválida.';
      let err = null;
      switch (a.a) {
        case 'play': err = this.doPlay(p, a, now); break;
        case 'draw': err = this.doDraw(p, now); break;
        case 'pass': err = this.doPass(p, now); break;
        case 'die': err = this.doDie(p, now); break;
        case 'revive': err = this.doRevive(p, a.target, now); break;
        case 'insert': err = this.doInsert(p, a.positions, now); break;
        case 'give': err = this.doGive(p, a.card, now); break;
        case 'dig': err = this.doDig(p, !!a.keep, now); break;
        default: err = 'Acción desconocida.';
      }
      if (!err) this.idleSince = now;
      return err || null;
    }

    doPlay(p, a, now) {
      const pl = this.plan(p.id, a.cards, a.target, a.named);
      if (pl.err) return pl.err;
      if (pl.need) return 'Falta elegir un objetivo.';
      for (const c of pl.cards) {
        p.hand.splice(p.hand.indexOf(c), 1);
        this.discard.push({ card: c, by: p.id });
      }
      const cardName = pl.cards.length === 1 && pl.cards[0].type === 'clone' ? 'Clon (como ' + NAMES[pl.eff] + ')' : NAMES[pl.cards[0].type];
      if (pl.kind === 'zombie') {
        const pr = this.prompt;
        const deadP = this.dead();
        const clair = this.players.some((o) => o.id !== p.id && o.hand.some((c) => c.type === 'clairvoyance'));
        this.prompt = {
          type: 'zombie', player: p.id, eks: [pr.card], needRevive: deadP.length > 0, revived: null,
          watchers: [], pendingPos: null, minUntil: clair ? now + this.cfg.CLAIR_MS : now,
          start: now, deadline: this.dl([p.id], now, this.cfg.PROMPT_MS + 15000),
        };
        this.emit('zombie', { player: p.id, text: p.name + ' juega ' + cardName + ' y se salva de explotar.' });
        if (deadP.length === 1) this.doRevive(p, deadP[0].id, now);
        return null;
      }
      if (pl.kind === 'nope') {
        const t = this.top();
        t.nopes++; t.last = p.id;
        const yup = t.nopes % 2 === 0;
        this.emit('nope', { player: p.id, yup, text: p.name + (yup ? ' responde con otro Nop: ¡la jugada vuelve a valer!' : ' dice ¡NOP! a ' + this.P(t.by).name + '.') });
        this.openWindow(now);
        return null;
      }
      const s = {
        id: ++this.pid, eff: pl.eff, by: p.id, last: p.id, target: pl.target || null, named: pl.named || null,
        of: pl.of || null, n: pl.cards.length, nopes: 0, passed: {}, deadline: 0, total: 0,
      };
      let text;
      const tn = s.target ? this.P(s.target).name : '';
      if (s.eff === 'combo2') text = p.name + ' juega una pareja de ' + NAMES[s.of] + ' contra ' + tn + '.';
      else if (s.eff === 'combo3') text = p.name + ' juega un trío de ' + NAMES[s.of] + ' contra ' + tn + ' y pide: ' + NAMES[s.named] + '.';
      else if (s.eff === 'favor') text = p.name + ' pide un Favor a ' + tn + '.';
      else if (s.eff === 'feed_dead') text = p.name + ' juega Alimenta a los Muertos para ' + tn + '.';
      else text = p.name + ' juega ' + cardName + '.';
      this.emit('play', { player: p.id, eff: s.eff, text });
      this.stack.push(s);
      this.openWindow(now);
      return null;
    }

    eligible(s) {
      return this.players.filter((o) => o.id !== s.last && (o.bot || o.connected) && o.hand.some((c) => c.type === 'nope'));
    }
    openWindow(now) {
      const s = this.top();
      if (!s) return;
      s.passed = {};
      s.total = this.eligible(s).length ? this.cfg.NOPE_MS : this.cfg.FAST_MS;
      s.deadline = now + s.total;
    }
    doPass(p, now) {
      const s = this.top();
      if (!s || (this.prompt && this.prompt.type !== 'zombie')) return 'No hay nada que pasar.';
      s.passed[p.id] = 1;
      if (this.eligible(s).every((o) => s.passed[o.id])) this.resolveTop(now);
      return null;
    }
    resolveTop(now) {
      const s = this.stack.pop();
      if (!s) return;
      if (s.nopes % 2) this.emit('cancel', { eff: s.eff, text: 'La jugada de ' + this.P(s.by).name + ' fue anulada.' });
      else this.apply(s, now);
      this.settle(now);
    }
    settle(now) {
      if (this.over) return;
      if (this.prompt && this.prompt.type !== 'zombie') return;
      if (this.stack.length) this.openWindow(now);
    }

    /* ---------- efectos ---------- */
    apply(s, now) {
      const p = this.P(s.by);
      const isCur = this.curP().id === p.id;
      switch (s.eff) {
        case 'attack':
        case 'attack_dead': {
          if (!isCur) return;
          const add = s.eff === 'attack' ? 2 : 3 * this.dead().length;
          if (!add) { this.emit('info', { text: 'Ya no hay muertos: el Ataque de los Muertos no tiene efecto.' }); return; }
          const n = (this.attacked ? this.turnsLeft : 0) + add;
          this.advance(n, true, now);
          this.emit('attack', { player: p.id, target: this.curP().id, n, text: this.curP().name + ' debe jugar ' + n + ' turnos seguidos.' });
          return;
        }
        case 'skip': if (isCur) { this.emit('info', { text: p.name + ' termina su turno sin robar.' }); this.endTurn(now); } return;
        case 'super_skip': if (isCur) { this.emit('info', { text: p.name + ' termina TODOS sus turnos sin robar.' }); this.advance(1, false, now); } return;
        case 'see_future': {
          const cards = this.draw.slice(-3).reverse().map((c) => c.type);
          this.emit('future', { cards, mut: this.mut, len: this.draw.length, shuf: this.shuf }, p.id);
          return;
        }
        case 'shuffle': this.shuffleDraw(); this.emit('shuffle', { text: 'El mazo fue barajado.' }); return;
        case 'feed_dead': {
          const t = this.P(s.target);
          if (!t || t.alive) return;
          const givers = this.living().filter((o) => o.id !== p.id && o.hand.length);
          if (!givers.length) return;
          this.startGive('feed', t.id, givers, now);
          return;
        }
        case 'favor': {
          const t = this.P(s.target);
          if (!t || !t.alive || !t.hand.length) return;
          this.startGive('favor', p.id, [t], now);
          return;
        }
        case 'grave_robber': {
          const givers = this.dead().filter((o) => o.hand.length);
          if (!givers.length) { this.emit('info', { text: 'Los muertos no tienen cartas que robar.' }); return; }
          this.startGive('rob', null, givers, now);
          return;
        }
        case 'dig_deeper': {
          if (!isCur) return;
          if (this.draw.length <= 1) { this.emit('info', { text: 'Solo queda 1 carta en el mazo: Cava Más Hondo no tiene efecto.' }); return; }
          const card = this.draw.pop(); this.mut++;
          this.prompt = { type: 'dig', player: p.id, card, start: now, deadline: this.dl([p.id], now) };
          return;
        }
        case 'combo2': {
          const t = this.P(s.target);
          if (!t || !t.alive || !t.hand.length) return;
          const c = t.hand.splice(Math.floor(this.rnd() * t.hand.length), 1)[0];
          p.hand.push(c);
          this.emit('steal', { player: p.id, target: t.id, text: p.name + ' le roba una carta al azar a ' + t.name + '.' });
          this.emit('got', { card: c.type, text: 'Le robaste ' + NAMES[c.type] + ' a ' + t.name + '.' }, p.id);
          this.emit('lost', { card: c.type, text: p.name + ' te robó ' + NAMES[c.type] + '.' }, t.id);
          return;
        }
        case 'combo3': {
          const t = this.P(s.target);
          if (!t || !t.alive) return;
          const i = t.hand.findIndex((c) => c.type === s.named);
          if (i < 0) { this.emit('info', { text: t.name + ' no tiene ' + NAMES[s.named] + '. ' + p.name + ' no consigue nada.' }); return; }
          const c = t.hand.splice(i, 1)[0];
          p.hand.push(c);
          this.emit('steal', { player: p.id, target: t.id, card: c.type, text: p.name + ' le quita ' + NAMES[c.type] + ' a ' + t.name + '.' });
          return;
        }
        case 'clairvoyance': {
          const pr = this.prompt;
          if (pr && pr.type === 'zombie' && pr.watchers.indexOf(p.id) < 0) pr.watchers.push(p.id);
          return;
        }
      }
    }

    startGive(reason, to, givers, now) {
      const waiting = {};
      for (const g of givers) waiting[g.id] = 1;
      this.prompt = { type: 'give', reason, to, waiting, pool: [], start: now, deadline: this.dl(givers.map((g) => g.id), now) };
    }
    doGive(p, cardId, now) {
      const pr = this.prompt;
      if (!pr || pr.type !== 'give' || !pr.waiting[p.id]) return 'No tienes que dar ninguna carta.';
      const i = p.hand.findIndex((c) => c.id === cardId);
      if (i < 0) return 'No tienes esa carta.';
      const c = p.hand.splice(i, 1)[0];
      delete pr.waiting[p.id];
      if (pr.reason === 'rob') {
        pr.pool.push(c);
        this.emit('info', { text: p.name + ' entrega una carta al mazo.' });
      } else {
        const t = this.P(pr.to);
        t.hand.push(c);
        this.emit('gave', { player: p.id, target: t.id, text: p.name + ' le da una carta a ' + t.name + '.' });
        this.emit('got', { card: c.type, text: p.name + ' te dio ' + NAMES[c.type] + '.' }, t.id);
      }
      if (!Object.keys(pr.waiting).length) {
        this.prompt = null;
        if (pr.reason === 'rob') { this.draw.push(...pr.pool); this.shuffleDraw(); this.emit('shuffle', { text: 'Las cartas de los muertos se barajan en el mazo.' }); }
        this.settle(now);
      }
      return null;
    }

    /* ---------- robar / explotar / zombi ---------- */
    doDraw(p, now) {
      if (this.curP().id !== p.id || !p.alive) return 'No es tu turno.';
      if (!this.idle()) return 'Espera a que termine la acción en curso.';
      const c = this.draw.pop(); this.mut++;
      this.emit('draw', { player: p.id });
      this.receive(p, c, now);
      return null;
    }
    receive(p, c, now) {
      if (c.type === 'exploding') {
        const td = this.topDiscard();
        const canSave = p.hand.some((x) => x.type === 'zombie') ||
          (p.hand.some((x) => x.type === 'clone') && td && td.card.type === 'zombie');
        this.emit('boom', { player: p.id, text: '¡' + p.name + ' sacó un GATITO EXPLOSIVO!' });
        if (!canSave) { this.die(p, c, now); return; }
        this.prompt = { type: 'explode', player: p.id, card: c, start: now, deadline: this.dl([p.id], now, 25000) };
        return;
      }
      p.hand.push(c);
      this.emit('got', { card: c.type, drawn: true, text: 'Robaste: ' + NAMES[c.type] + '.' }, p.id);
      this.endTurn(now);
    }
    doDie(p, now) {
      const pr = this.prompt;
      if (!pr || pr.type !== 'explode' || pr.player !== p.id) return 'No puedes hacer eso ahora.';
      this.die(p, pr.card, now);
      return null;
    }
    die(p, card, now) {
      this.prompt = null;
      p.alive = false; p.ek = card;
      this.emit('died', { player: p.id, text: '💥 ' + p.name + ' explotó y está MUERTO (por ahora).' });
      const alive = this.living();
      if (alive.length <= 1) {
        this.over = { winner: alive[0] ? alive[0].id : null };
        this.stack = [];
        this.emit('over', { winner: this.over.winner, text: '🏆 ' + (alive[0] ? alive[0].name : 'Nadie') + ' es el último gatito con vida. ¡Gana la partida!' });
        return;
      }
      this.advance(1, false, now);
    }
    doRevive(p, target, now) {
      const pr = this.prompt;
      if (!pr || pr.type !== 'zombie' || pr.player !== p.id) return 'No puedes hacer eso ahora.';
      if (!pr.needRevive || pr.revived) return 'No hay nadie a quien revivir.';
      const t = this.P(target);
      if (!t || t.alive) return 'Elige a un jugador muerto.';
      t.alive = true; pr.eks.push(t.ek); t.ek = null; pr.revived = t.id;
      this.emit('revived', { player: p.id, target: t.id, text: '🧟 ' + p.name + ' revive a ' + t.name + '. ¡Vuelve al juego!' });
      return null;
    }
    doInsert(p, positions, now) {
      const pr = this.prompt;
      if (!pr || pr.type !== 'zombie' || pr.player !== p.id) return 'No puedes hacer eso ahora.';
      if (pr.needRevive && !pr.revived) return 'Primero elige a quién revivir.';
      if (!Array.isArray(positions) || positions.length !== pr.eks.length) return 'Posiciones inválidas.';
      for (let i = 0; i < positions.length; i++) {
        const v = positions[i];
        if (!Number.isInteger(v) || v < 0 || v > this.draw.length + i) return 'Posición fuera del mazo.';
      }
      pr.pendingPos = positions.slice();
      if (!this.stack.length && now >= pr.minUntil) this.finishInsert(now);
      return null;
    }
    finishInsert(now) {
      const pr = this.prompt;
      const p = this.P(pr.player);
      pr.pendingPos.forEach((pos, i) => {
        this.draw.splice(Math.max(0, this.draw.length - pos), 0, pr.eks[i]);
      });
      this.mut++; this.shuf++;
      for (const w of pr.watchers) {
        this.emit('clair', { positions: pr.pendingPos.slice(), len: this.draw.length, shuf: this.shuf, text: 'Clarividencia: viste dónde quedó cada Gatito Explosivo.' }, w);
      }
      this.prompt = null;
      this.emit('inserted', { player: p.id, n: pr.eks.length, len: this.draw.length, shuf: this.shuf, text: p.name + ' esconde ' + (pr.eks.length > 1 ? 'los ' + pr.eks.length + ' Gatitos Explosivos' : 'el Gatito Explosivo') + ' en el mazo.' });
      this.endTurn(now);
      this.settle(now);
    }
    doDig(p, keep, now) {
      const pr = this.prompt;
      if (!pr || pr.type !== 'dig' || pr.player !== p.id) return 'No puedes hacer eso ahora.';
      this.prompt = null;
      if (keep) {
        this.emit('info', { text: p.name + ' se queda con la primera carta.' });
        this.receive(p, pr.card, now);
      } else {
        const second = this.draw.pop();
        this.draw.push(pr.card); this.mut++; this.shuf++;
        this.emit('info', { text: p.name + ' no quiso la primera carta… y roba la siguiente.' });
        this.receive(p, second, now);
      }
      this.settle(now);
      return null;
    }

    endTurn(now) {
      this.turnsLeft--;
      if (this.turnsLeft <= 0) this.advance(1, false, now);
      else this.idleSince = now;
    }
    advance(n, attacked, now) {
      this.cur = this.nextLivingIdx(this.cur);
      this.turnsLeft = n; this.attacked = attacked; this.idleSince = now;
      this.emit('turn', { player: this.curP().id });
    }

    /* ---------- tiempo: plazos y acciones automáticas ---------- */
    setConnected(pid, on, now) {
      const p = this.P(pid);
      if (!p) return;
      p.connected = on;
      const pr = this.prompt;
      if (!on && pr) {
        const mine = pr.player === pid || (pr.waiting && pr.waiting[pid]);
        if (mine) pr.deadline = Math.min(pr.deadline, now + this.cfg.GONE_MS);
      }
      if (!on) this.idleSince = Math.max(this.idleSince, now);
    }
    nextDeadline() {
      if (this.over) return null;
      const pr = this.prompt;
      let d = Infinity;
      if (this.stack.length && (!pr || pr.type === 'zombie')) d = Math.min(d, this.top().deadline);
      if (pr) {
        d = Math.min(d, pr.deadline);
        if (pr.type === 'zombie' && pr.pendingPos) d = Math.min(d, pr.minUntil);
      }
      const c = this.curP();
      if (this.idle() && !c.bot && !c.connected) d = Math.min(d, this.idleSince + this.cfg.GONE_MS);
      return d === Infinity ? null : d;
    }
    tick(now) {
      for (let guard = 0; guard < 30 && !this.over; guard++) {
        const pr = this.prompt;
        if (pr && pr.type === 'zombie' && pr.pendingPos && !this.stack.length && now >= pr.minUntil) { this.finishInsert(now); continue; }
        if (this.stack.length && (!pr || pr.type === 'zombie') && now >= this.top().deadline) { this.resolveTop(now); continue; }
        if (pr && now >= pr.deadline) { this.autoPrompt(now); continue; }
        const c = this.curP();
        if (this.idle() && !c.bot && !c.connected && now >= this.idleSince + this.cfg.GONE_MS) { this.act(c.id, { a: 'draw' }, now); continue; }
        break;
      }
    }
    autoPrompt(now) {
      const pr = this.prompt;
      const pick = (arr) => arr[Math.floor(this.rnd() * arr.length)];
      if (pr.type === 'explode') {
        const p = this.P(pr.player);
        const z = p.hand.find((c) => c.type === 'zombie') || p.hand.find((c) => c.type === 'clone');
        if (!z || this.act(p.id, { a: 'play', cards: [z.id] }, now)) this.die(p, pr.card, now);
      } else if (pr.type === 'zombie') {
        const p = this.P(pr.player);
        if (pr.needRevive && !pr.revived) this.doRevive(p, pick(this.dead()).id, now);
        if (!pr.pendingPos) {
          const pos = pr.eks.map((_, i) => Math.floor(this.rnd() * (this.draw.length + i + 1)));
          this.doInsert(p, pos, now);
        }
        if (this.prompt === pr) { this.stack = []; pr.minUntil = now; this.finishInsert(now); }
      } else if (pr.type === 'give') {
        for (const id of Object.keys(pr.waiting)) { const p = this.P(id); this.doGive(p, pick(p.hand).id, now); }
      } else if (pr.type === 'dig') {
        this.doDig(this.P(pr.player), true, now);
      }
    }

    /* ---------- vista por jugador (oculta la información secreta) ---------- */
    view(pid, now) {

      }
      return v;
    }
  }

  return { Game, DECK, NAMES, NOW, isCat, shuffleArr };
});

          if (has('attack_dead') && deadN) return play(has('attack_dead'));
          if (has('skip')) return play(has('skip'));
          if (has('super_skip')) return play(has('super_skip'));
          if (has('shuffle') && top) return play(has('shuffle'));
          if (has('dig_deeper') && g.draw.length > 1 && top) return play(has('dig_deeper'));
        }
        if (others.length && rnd() < 0.3) {
          const byType = {};
          for (const c of me.hand) if (c.type !== 'zombie' && c.type !== 'nope' && c.type !== 'clone') (byType[c.type] = byType[c.type] || []).push(c);
          const pair = Object.values(byType).filter((a) => a.length >= 2).sort((x, y) => val(x[0].type) - val(y[0].type))[0];
          if (pair && val(pair[0].type) <= 4) return { a: 'play', cards: [pair[0].id, pair[1].id], target: pick(others).id };
          if (has('favor')) return play(has('favor'), { target: pick(others).id });
        }
        if (deadN && has('grave_robber') && danger > 0.3 && rnd() < 0.5) return play(has('grave_robber'));
        return { a: 'draw' };
      }

      /* ----- DIFÍCIL ----- */
      const zs = me.hand.filter((c) => c.type === 'zombie').length;
      const richest = others.slice().sort((x, y) => y.hand.length - x.hand.length)[0];
      // 1) Fortalecerse: conseguir Gatitos Zombi y cartas ajenas mientras el riesgo es bajo
      if (richest) {
        const byType = {};
        for (const c of me.hand) if (c.type !== 'zombie' && c.type !== 'nope' && c.type !== 'clone') (byType[c.type] = byType[c.type] || []).push(c);
        const groups = Object.values(byType).filter((a) => val(a[0].type) <= 3).sort((x, y) => y.length - x.length || val(x[0].type) - val(y[0].type));
        const grp = groups[0];
        if (grp && grp.length >= 3 && zs < 2) return { a: 'play', cards: grp.slice(0, 3).map((c) => c.id), target: richest.id, named: 'zombie' };
        if (grp && grp.length >= 2) return { a: 'play', cards: grp.slice(0, 2).map((c) => c.id), target: richest.id };
        if (has('favor')) return play(has('favor'), { target: richest.id });
      }
      // 2) Informarse antes de arriesgar
      if (!top && danger >= 0.14 && has('see_future')) return play(has('see_future'));
      // 3) Esquivar: con Zombi en mano tolera más riesgo
      const thr = zs ? 0.34 : 0.2;
      if (danger >= thr) {
        if (g.turnsLeft > 1 && has('super_skip')) return play(has('super_skip'));
        if (has('attack')) return play(has('attack'));
        if (has('attack_dead') && deadN) return play(has('attack_dead'));
        if (has('skip')) return play(has('skip'));
        if (has('super_skip')) return play(has('super_skip'));
        if (has('dig_deeper') && g.draw.length > 1 && this.known(me.id, 1) !== 'exploding') return play(has('dig_deeper'));
        if (top === 'exploding' && has('shuffle')) return play(has('shuffle'));
        if (deadN && has('grave_robber') && g.dead().some((o) => o.hand.length)) return play(has('grave_robber'));
      }
      return { a: 'draw' };
    }
  }

  return { Room };
});

<script>/* Interfaz del juego: pantallas, red (anfitrión / invitado), animaciones y sonido. */
(function () {

  const store = {

    set(k, v) { try { localStorage.setItem('zk_' + k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } },
  };
  const Native = window.Android || null;

  const S = {

    sel: [], seq: 0, log: [], modal: null, ins: [0, 0], giveSel: null, fresh: true,
    info: { ip: '', port: 8765, local: true, native: !!Native, static: !!window.ZK_STATIC }, found: [], conn: 'off', joinHost: '',
    isSolo: false, solo: Object.assign({ n: 2, level: 'normal', deck: 'official' }, store.get('solo', {})),
    version: (window.Android && Android.version && Android.version()) || '', update: null, updateProgress: null, updateMsg: null,
  };
  const LEVELS = { easy: ['😺', 'Fácil', 'Juega casi al azar. Ideal para aprender.'], normal: ['😼', 'Normal', 'Esquiva cuando el riesgo sube y usa sus cartas con cabeza.'], hard: ['😈', 'Difícil', 'Recuerda el mazo, te roba los Zombis y te deja el explosivo arriba.'], mix: ['🎲', 'Mixta', 'Cada rival con una dificultad distinta.'] };

  /* ================= sonido ================= */
  let ac = null;

    boom: () => { tone(900, 0.5, 'sawtooth', 0.1, 1800); },
    die: () => { tone(160, 0.7, 'sawtooth', 0.22, 30); tone(90, 0.8, 'square', 0.18, 25, 0.05); },
    zombie: () => { tone(196, 0.2, 'sawtooth', 0.12, 262); tone(262, 0.2, 'sawtooth', 0.12, 330, 0.18); tone(330, 0.3, 'sawtooth', 0.12, 392, 0.36); },

  };
  const buzz = (ms) => { try { if (Native && Native.vibrate) Native.vibrate(ms); else if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* no vibra */ } };

  /* ================= red ================= */
  let room = null, relay = null, ws = null, wsUrl = null, retryT = null, pingT = null, lastMsg = 0, pingAt = 0, left = true;

  }

        case 'turn': if (mine && !v.over) { SFX.turn(); buzz(60); toast('¡Tu turno!', 'good'); } break;
        case 'nope': SFX.nope(); bigfx(e.yup ? '¡SIP!' : '¡NOP!', e.yup ? 'green' : 'red'); break;
        case 'attack': SFX.attack(); if (e.target === S.you) { bigfx('¡TE ATACAN! ×' + e.n, 'red'); buzz(200); } break;
        case 'boom': SFX.boom(); bigfx('💣', 'bomb'); break;
        case 'died': SFX.die(); shake(); buzz(400); bigfx(mine ? '¡EXPLOTASTE!' : '¡BOOM!', 'red'); break;
        case 'zombie': SFX.zombie(); bigfx('🧟 ¡ZOMBI!', 'green'); break;
        case 'revived': if (e.target === S.you) { bigfx('¡REVIVISTE!', 'green'); buzz(200); } break;
        case 'shuffle': SFX.shuffle(); break;
        case 'future': S.modal = { type: 'future', cards: e.cards }; break;
        case 'clair': S.modal = { type: 'clair', positions: e.positions, len: e.len }; break;
        case 'got': case 'lost': toast(e.text, e.type === 'lost' ? 'bad' : 'good'); break;
        case 'steal': if (e.target === S.you && e.card) toast(e.text, 'bad'); break;
        case 'over': if (e.winner === S.you) SFX.win(); else SFX.lose(); break;
      }
    }
    if (S.log.length > 120) S.log.splice(0, S.log.length - 120);
  }

  /* ================= helpers de vista ================= */
  const P = (id) => S.view.players.find((p) => p.id === id);
  const pname = (id) => { const p = P(id); return p ? (id === S.you ? 'Tú' : esc(p.name)) : '?'; };
  const remain = (o) => Math.max(0, o.remain - (performance.now() - S.viewAt));
  const timerBar = (o, cls) => {
    const r = remain(o), from = o.total ? Math.min(1, r / o.total) : 1;
    return `<div class="timer ${cls || ''}"><i style="--from:${from.toFixed(3)};animation-duration:${Math.round(r)}ms"></i></div>`;
  };
  const lvlOf = (id) => { const p = S.lobby && S.lobby.players.find((x) => x.id === id); return p ? p.level : null; };
  const sortHand = (h) => h.slice().sort((a, b) => K.ORDER.indexOf(a.type) - K.ORDER.indexOf(b.type) || (a.id < b.id ? -1 : 1));
  const btn = (label, a, cls, extra) => `<button class="btn ${cls || ''}" data-act="${a}" ${extra || ''}>${label}</button>`;

  function comboState() {
    const v = S.view, sel = S.sel.map((id) => v.hand.find((c) => c.id === id)).filter(Boolean);
    if (sel.length < 2) return null;
    if (sel.length > 3) return { err: 'Máximo 3 cartas por jugada.' };
    const real = sel.filter((c) => c.type !== 'clone');
    if (!real.length) return { err: 'El Clon necesita acompañar a otra carta.' };
    if (real.some((c) => c.type !== real[0].type)) return { err: 'Para un combo, las cartas deben ser iguales.' };
    const me = P(S.you);
    if (v.cur !== S.you || !me.alive) return { err: 'Los combos solo se juegan en tu turno.' };
    if (v.prompt || v.stack.length) return { err: 'Espera a que termine la jugada en curso.' };
    if (!v.players.some((p) => p.id !== S.you && p.alive && p.count)) return { err: 'Nadie tiene cartas para robar.' };
    return { n: sel.length, of: real[0].type };
  }

  /* ================= pantallas ================= */
  const screens = {};

  function profileHTML() {
    return `<div class="profile">
      <button class="avatar big" data-act="avatar" aria-label="Cambiar gato">${K.avatar(S.avatar)}<i>↻</i></button>

  function updateHTML() {
    const u = S.update, p = S.updateProgress, m = S.updateMsg;

    return `<div class="update"><span>${m ? esc(m) : 'Versión instalada: ' + esc(S.version || '?')}</span>${btn('Buscar actualizaciones', 'checkUpdate', 'sm')}</div>`;
  }
  screens.home = () => {
    const host = S.info.local;
    return `<div class="screen home"><div class="home-art">${K.logo()}<p class="tag">Explota. Revive. Vuelve a explotar.</p></div>
      ${profileHTML()}
      ${S.info.native ? updateHTML() : ''}
      <div class="menu">
        ${S.info.static ? btn('🤖 Jugar contra la IA', 'solo', 'primary xl') : ''}
        ${!S.info.static && host ? btn('🏠 Crear partida', 'create', 'primary') : ''}
        ${S.info.static ? '' : host ? btn('📡 Unirse a una partida', 'goJoin', 'green') : btn('📡 Unirse a esta partida', 'joinHere', 'primary')}
        ${S.info.static ? '' : btn('🤖 Un jugador contra la IA', 'solo')}
        <div class="row">${btn('📖 Cómo jugar', 'rules')}${btn('🃏 Cartas', 'cards')}</div>
      </div>

  };
  screens.solo = () => {
    const o = S.solo, deckInfo = o.deck === 'full' ? 'Todas las cartas (57) + explosivos.' : o.n === 1 ? 'Oficial para 2: las 24 cartas con huella 🐾 y 1 explosivo.' : o.n === 2 ? 'Oficial para 3: las 33 cartas sin huella y 2 explosivos.' : 'Oficial: todas las cartas y ' + o.n + ' explosivos.';
    return `<div class="screen pad"><header class="bar"><button class="ic" data-act="home">‹</button><h2>Un jugador</h2></header>

      <h3>Rivales controlados por la IA</h3>
      <div class="seg">${[1, 2, 3, 4].map((k) => `<button class="${o.n === k ? 'on' : ''}" data-act="soloN" data-n="${k}"><b>${k}</b><span>${k === 1 ? 'rival' : 'rivales'}</span></button>`).join('')}</div>
      <h3>Dificultad</h3>
      <div class="levels">${Object.keys(LEVELS).map((k) => `<button class="${o.level === k ? 'on' : ''}" data-act="soloLevel" data-l="${k}"><i>${LEVELS[k][0]}</i><div><b>${LEVELS[k][1]}</b><span>${LEVELS[k][2]}</span></div></button>`).join('')}</div>
      <div class="row">${btn(o.deck === 'full' ? '🃏 Mazo: completo' : '🃏 Mazo: oficial', 'soloDeck')}</div>
      <p class="dim small">${deckInfo}</p>
      <div class="grow"></div>
      ${btn('¡Jugar!', 'soloStart', 'primary xl')}</div>`;
  };
  screens.connecting = () => `<div class="screen center"><div class="spinner"></div><h2>Conectando…</h2><p class="dim">${esc(S.joinHost)}</p>
    <p class="dim">Asegúrate de estar en la misma red Wi-Fi que el anfitrión y de que ya creó la partida.</p>${btn('Cancelar', 'home')}</div>`;
  screens.join = () => {
    const pre = S.info.ip ? S.info.ip.split('.').slice(0, 3).join('.') + '.' : '';
    return `<div class="screen pad"><header class="bar"><button class="ic" data-act="home">‹</button><h2>Unirse a una partida</h2></header>
